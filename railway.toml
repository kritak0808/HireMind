# railway.toml — HireMind AI API Gateway Railway Deployment Configuration
# Tells Railway how to build and start the FastAPI backend service.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api-gateway/Dockerfile"

[deploy]
startCommand = "sh -c 'uvicorn main:app --app-dir apps/api-gateway/src --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
