version: '3.8'

services:
  # Secured production PostgreSQL instance
  postgres:
    image: postgres:16-alpine
    container_name: hiremind_postgres_prod
    environment:
      POSTGRES_DB: hiremind_production_db
      POSTGRES_USER: hiremind_prod_user
      POSTGRES_PASSWORD: hiremind_prod_secure_password_2026
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiremind_prod_user -d hiremind_production_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hiremind_prod_network

  # Production Redis instance
  redis:
    image: redis:7-alpine
    container_name: hiremind_redis_prod
    command: redis-server --requirepass hiremind_prod_redis_password_2026
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "hiremind_prod_redis_password_2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hiremind_prod_network

  # Qdrant vector search database
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: hiremind_qdrant_prod
    volumes:
      - qdrantdata_prod:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hiremind_prod_network

  # S3 Object Storage (MinIO)
  minio:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    container_name: hiremind_minio_prod
    environment:
      MINIO_ROOT_USER: minio_prod_admin_user
      MINIO_ROOT_PASSWORD: minio_prod_admin_secure_password_2026
    command: server /data
    volumes:
      - miniodata_prod:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hiremind_prod_network

  # FastAPI API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: ./apps/api-gateway/Dockerfile
    container_name: hiremind_api_gateway_prod
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://hiremind_prod_user:hiremind_prod_secure_password_2026@postgres:5432/hiremind_production_db
      - REDIS_URL=redis://:hiremind_prod_redis_password_2026@redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minio_prod_admin_user
      - MINIO_SECRET_KEY=minio_prod_admin_secure_password_2026
      - MINIO_SECURE=false
      - MINIO_BUCKET_NAME=hiremind-prod-assets
      - SECRET_KEY=hiremind_prod_encryption_secret_key_sig_2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - hiremind_prod_network

  # Next.js Web Frontend Portal
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: hiremind_web_prod
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api/v1
    depends_on:
      - api-gateway
    networks:
      - hiremind_prod_network

  # Celery Background Workers
  celery_worker:
    build:
      context: .
      dockerfile: ./apps/api-gateway/Dockerfile
    container_name: hiremind_celery_worker_prod
    command: celery -A libs.tasks worker --loglevel=info
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://hiremind_prod_user:hiremind_prod_secure_password_2026@postgres:5432/hiremind_production_db
      - REDIS_URL=redis://:hiremind_prod_redis_password_2026@redis:6379/0
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hiremind_prod_network

  # Nginx Gateway Reverse Proxy (Load Balancer & SSL Terminator)
  nginx:
    image: nginx:1.25-alpine
    container_name: hiremind_nginx_prod
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api-gateway
    networks:
      - hiremind_prod_network

networks:
  hiremind_prod_network:
    driver: bridge

volumes:
  pgdata_prod:
  redisdata_prod:
  qdrantdata_prod:
  miniodata_prod:
