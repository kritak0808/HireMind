[tool.poetry]
name = "hiremind-agent-orchestrator"
version = "0.1.0"
description = "LangGraph agentic interview orchestration service for HireMind AI"
authors = ["HireMind AI Engineering <engineering@hiremind.ai>"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.110.0"
uvicorn = "^0.28.0"
pydantic = "^2.6.4"
langchain = "^0.1.12"
langgraph = "^0.0.26"
libs-config = { path = "../../libs/config", develop = true }
libs-telemetry = { path = "../../libs/telemetry", develop = true }
libs-security = { path = "../../libs/security", develop = true }
libs-auth = { path = "../../libs/auth", develop = true }
libs-db-core = { path = "../../libs/db-core", develop = true }
libs-events = { path = "../../libs/events", develop = true }

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
