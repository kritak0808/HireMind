name: Enterprise CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  frontend-validation:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create ESLint config
        run: echo '{"extends":"next/core-web-vitals"}' > apps/web/.eslintrc.json

      - name: Lint Next.js
        run: pnpm lint:web

      - name: Build Next.js Production Bundle
        run: pnpm build:web

  backend-validation:
    name: Backend Lint, Typecheck & Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest bandit
          pip install -r requirements-dev.txt

      - name: Lint Check (Ruff)
        run: ruff check .

      - name: Static Security Scan (Bandit)
        run: bandit -r libs/ apps/api-gateway/ -ll -ii

      - name: Run Pytest
        run: |
          export PYTHONPATH="apps/api-gateway/src:libs/config/src:libs/telemetry/src:libs/security/src:libs/auth/src:libs/db-core/src:libs/shared-schemas/src:libs/events/src"
          python -m pytest
